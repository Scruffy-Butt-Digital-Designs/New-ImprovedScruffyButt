<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urban Container Gardening | Scruffy Butt Digital Designs</title>
  <meta name="description" content="Explore container gardening for homes with limited outdoor space.">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .book-sales-cover {
      display: block;
      width: 100%;
      height: auto;
      max-height: 38rem;
      object-fit: contain;
      object-position: center top;
    }
    @media (max-width: 640px) {
      .book-sales-cover { max-height: 28rem; }
    }
  </style>
</head>
<body class="book-sales-page">
  <main class="container book-sales">
    <nav class="book-sales-nav" aria-label="Bookstore">
      <a href="../index.html#shopGrid">Back to bookstore</a>
      <a href="../index.html#book-cart-heading">View cart</a>
      <a href="../customer-agreement-center.html">Customer Agreement Center</a>
    </nav>
    <article class="book-sales-layout">
      <img class="book-sales-cover" src="../covers/book-38.webp" alt="Cover of Urban Container Gardening">
      <div>
        <p class="book-sales-category">Gardening · Digital book</p>
        <h1>Urban Container Gardening</h1>
        <h2>About the book</h2>
        <p>Explore container gardening for homes with limited outdoor space. Match pots and plants to the space, sunlight, and watering routine you can realistically provide.</p>
        <p class="book-sales-price">$29.00 USD</p>
        <form action="../index.html#book-cart-heading" method="get">
          <input type="hidden" name="add-book" value="38">
          <label>
            Quantity
            <input type="number" name="quantity" value="1" min="1" max="20" step="1" required>
          </label>
          <button class="btn btn-primary" type="submit">Add to Cart</button>
        </form>
      </div>
    </article>
  </main>

</html>
