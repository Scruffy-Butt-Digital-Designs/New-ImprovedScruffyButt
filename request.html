<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scruffy ByDesign | Scruffy Butt Digital Designs</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #341528, #100c10 60%);
      color: #fff5fa;
      font-family: "Comic Sans MS", "Comic Sans", cursive;
    }

    main {
      box-sizing: border-box;
      max-width: 560px;
      margin: 0 auto;
      padding: 64px 20px;
      text-align: center;
    }

    h1 {
      color: #ffd77a;
      margin: 0 0 24px;
    }

    .mailbox {
      display: block;
      padding: 32px 20px;
      border: 2px solid #ff64ad;
      border-radius: 20px;
      background: #20141d;
      color: #ffd77a;
      box-shadow: 0 0 24px #ff64ad30;
      text-decoration: none;
      font-weight: bold;
    }

    .mailbox:hover {
      background: #352033;
    }

    a:focus-visible {
      outline: 3px solid #ffd77a;
      outline-offset: 5px;
    }

    .mailbox-icon {
      display: block;
      margin-bottom: 10px;
      font-size: 3rem;
    }

    .back {
      display: inline-block;
      margin-top: 24px;
      color: #ffadd2;
    }
  </style>
</head>
<body>
  <main>
    <h1>Scruffy ByDesign</h1>

    <a class="mailbox" href="https://tally.so/r/Dq7W9l">
      <span class="mailbox-icon" aria-hidden="true">📬</span>
      Open Request Form
    </a>

    <a class="back" href="https://zackz2022.github.io/Scruffy2.0/">
      Back to Scruffy Butt Digital Designs
    </a>
  </main>
</body>
</html>
